<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="illustration-title">
<title id="illustration-title">クリケットの試合で序盤の失点から立ち直ったニュージーランド代表を象徴する創作イラスト</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B2E7DD"/><stop offset="1" stop-color="#BBD0F4"/></linearGradient>
 <filter id="soft"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#102D44" flood-opacity=".21"/></filter>
 <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#fff" opacity=".36"/></pattern>
</defs>
<rect width="800" height="480" rx="28" fill="url(#bg)"/>
<circle cx="700" cy="54" r="130" fill="#fff" opacity=".17"/>
<circle cx="85" cy="434" r="152" fill="#fff" opacity=".13"/>
<path d="M0 418Q200 378 416 412T800 390V480H0Z" fill="#227F75" opacity=".13"/>
<path d="M76 85h45m-22-22v45M721 333h42m-21-21v42" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".63"/>

<!-- cricket ground and boundary -->
<path d="M0 306Q200 259 400 309T800 293V480H0Z" fill="#79B98E"/>
<path d="M0 393Q200 364 400 403T800 382" fill="none" stroke="#E9F4E8" stroke-width="9" opacity=".85"/>
<ellipse cx="446" cy="388" rx="210" ry="67" fill="#D3B18A" opacity=".8"/>
<!-- Stumps with bails: distinct from soccer -->
<g filter="url(#soft)" stroke="#34546D" stroke-width="8" stroke-linecap="round">
 <path d="M569 218v190M616 219v189M661 218v190" stroke="#FFE3AB" stroke-width="18"/>
 <path d="M562 210h63m-16 0h60" stroke="#34546D" stroke-width="12"/>
</g>
<!-- Swinging cricket bat and arms -->
<g transform="rotate(-33 346 261)" filter="url(#soft)">
 <rect x="315" y="91" width="71" height="274" rx="28" fill="#F7CE83" stroke="#35516B" stroke-width="11"/>
 <path d="M330 122h42M330 149h42" stroke="#DFA65E" stroke-width="6"/>
 <rect x="337" y="333" width="29" height="103" rx="11" fill="#2B506F"/>
 <path d="M343 352h18m-17 20h17m-17 22h17" stroke="#A9DBD1" stroke-width="6"/>
</g>
<!-- Red leather ball with a stitched seam and upward motion -->
<g filter="url(#soft)">
 <circle cx="516" cy="135" r="62" fill="#C9585D" stroke="#883B53" stroke-width="8"/>
 <path d="M470 100q80 43 86 85" fill="none" stroke="#FFF1D6" stroke-width="7" stroke-dasharray="7 9" stroke-linecap="round"/>
 <path d="M465 125q54 42 57 79" fill="none" stroke="#FFE3CA" stroke-width="5" opacity=".85"/>
</g>
<path d="M420 222Q461 180 470 152" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="13 16"/>
<!-- Score panel signals a comeback without inventing numeric totals -->
<g filter="url(#soft)">
 <rect x="71" y="62" width="208" height="151" rx="25" fill="#264B64" stroke="#E1F4E7" stroke-width="7"/>
 <text x="173" y="120" text-anchor="middle" fill="#E4F4EC" font-family="system-ui,sans-serif" font-weight="800" font-size="27" letter-spacing="2">5 OUT</text>
 <path d="M110 169h55l36-29 32 1" fill="none" stroke="#A3E0BC" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="m214 123 24 16-24 17" fill="none" stroke="#A3E0BC" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<path d="M707 109l19-20m-2 50 29-2m-45 20-4 29" fill="none" stroke="#FFF7CE" stroke-width="10" stroke-linecap="round"/>

</svg>