name: Deploy reader website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site.yml'
      - 'build_site.py'
      - 'check_public_country_release.py'
      - 'check_country_experience.py'
      - 'check_release_candidate.py'
      - 'run_mobile_preflight.sh'
      - 'country-highlights.json'
      - 'country-highlight-sources.json'
      - 'travel-stops.json'
      - 'index.html'
      - 'tests/**'
      - 'manifest.webmanifest'
      - 'notifications.js'
      - 'notification-config.json'
      - 'service-worker.js'
      - 'world-passport.js'
      - 'assets/**'
      - 'data/current.json'
      - 'data/archive/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          # Always build the latest verified main, not a stale event SHA.
          # An approved nightly release may have been pushed while this job was queued.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release rules
        run: python -m unittest discover -s tests -v
      - name: Restore validated, correctly licensed Wikimedia photos
        uses: actions/cache@v4
        with:
          path: .cache/yoru9-photos
          key: yoru9-photo-cache-v1-${{ runner.os }}-${{ hashFiles('travel-stops.json', 'index.html') }}
          restore-keys: |
            yoru9-photo-cache-v1-${{ runner.os }}-
      - name: Create safe public site bundle
        env:
          YORU9_PHOTO_CACHE_DIR: .cache/yoru9-photos
        run: python build_site.py
      - name: Validate every published reader feature and licensed image
        run: python check_release_candidate.py --site _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for GitHub Pages artifact to appear in Actions API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo unavailable)"
            if [ "$count" = "1" ]; then
              echo "GitHub Pages artifact indexed and ready"
              break
            fi
            if [ "$count" != "0" ] && [ "$count" != "unavailable" ]; then
              echo "Unexpected Pages artifact count: $count"
              exit 1
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Pages artifact did not become readable after upload"
              exit 1
            fi
            sleep 5
          done
      # GitHub can list the artifact through the Actions REST API while
      # deploy-pages still temporarily sees 0 artifacts in its own endpoint.
      # Retry that transient indexing failure without regenerating media or
      # bypassing ANY source/release gate. The second failure is fatal.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Back off if Pages metadata has not propagated
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry GitHub Pages deployment after indexing delay
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Verify published country portraits and tourist microtravel
        env:
          PUBLISHED_SITE: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
          PUBLISHED_REVISION: ${{ github.sha }}
        run: |
          : "${PUBLISHED_SITE:?GitHub Pages did not return a deployment URL}"
          python check_public_country_release.py --site "$PUBLISHED_SITE" --revision "$PUBLISHED_REVISION"
