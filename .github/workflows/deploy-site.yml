name: Deploy reader website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site.yml'
      - 'build_site.py'
      - 'check_public_country_release.py'
      - 'check_country_experience.py'
      - 'check_release_candidate.py'
      - 'country-highlights.json'
      - 'country-highlight-sources.json'
      - 'travel-stops.json'
      - 'index.html'
      - 'tests/**'
      - 'manifest.webmanifest'
      - 'notifications.js'
      - 'notification-config.json'
      - 'service-worker.js'
      - 'world-passport.js'
      - 'assets/**'
      - 'data/current.json'
      - 'data/archive/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          # Always build the latest verified main, not a stale event SHA.
          # An approved nightly release may have been pushed while this job was queued.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release rules
        run: python -m unittest discover -s tests -v
      - name: Create safe public site bundle
        run: python build_site.py
      - name: Validate every published reader feature and licensed image
        run: python check_release_candidate.py --site _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for GitHub Pages artifact to appear in Actions API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo unavailable)"
            if [ "$count" = "1" ]; then
              echo "GitHub Pages artifact indexed and ready"
              break
            fi
            if [ "$count" != "0" ] && [ "$count" != "unavailable" ]; then
              echo "Unexpected Pages artifact count: $count"
              exit 1
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Pages artifact did not become readable after upload"
              exit 1
            fi
            sleep 5
          done
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published country portraits and tourist microtravel
        env:
          PUBLISHED_SITE: ${{ steps.deployment.outputs.page_url }}
          PUBLISHED_REVISION: ${{ github.sha }}
        run: |
          python check_public_country_release.py --site "$PUBLISHED_SITE" --revision "$PUBLISHED_REVISION"
