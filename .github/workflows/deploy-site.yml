name: Deploy reader website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site.yml'
      - 'build_site.py'
      - 'check_public_country_release.py'
      - 'country-highlights.json'
      - 'country-highlight-sources.json'
      - 'travel-stops.json'
      - 'index.html'
      - 'tests/**'
      - 'manifest.webmanifest'
      - 'notifications.js'
      - 'notification-config.json'
      - 'service-worker.js'
      - 'assets/**'
      - 'data/current.json'
      - 'data/archive/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          # Always build the latest verified main, not a stale event SHA.
          # An approved nightly release may have been pushed while this job was queued.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release rules
        run: python -m unittest discover -s tests -v
      - name: Create safe public site bundle
        run: python build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published country portraits and tourist microtravel
        env:
          PUBLISHED_SITE: ${{ steps.deployment.outputs.page_url }}
          PUBLISHED_REVISION: ${{ github.sha }}
        run: |
          python check_public_country_release.py --site "$PUBLISHED_SITE" --revision "$PUBLISHED_REVISION"
