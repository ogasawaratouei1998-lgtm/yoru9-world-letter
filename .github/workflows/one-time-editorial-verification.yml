name: Manual full Gemini editorial verification (read-only)

# Changing this workflow on main triggers one additional read-only
# end-to-end Gemini verification. Normal application code commits do not.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-editorial-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the editorial regression tests
        run: python -m unittest discover -s tests -p 'test_auto_editorial.py' -v
      - name: Verify API key is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Gemini key is missing; no review or publication"
            exit 1
          fi
      - name: Collect source candidates
        run: python collect_candidates.py
      - name: Simulate a new issue without altering any published file
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          rm -f "data/approved/$DAY.json"
          echo "No local approval for $DAY: test review must independently select candidates"
      - name: Run bounded AI editorial and independent fact review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python auto_editorial.py
      - name: Summarize AI review outcome (test-only; never publish)
        if: always()
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json, os
          day=datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          p=Path("data/approved")/(day+".json")
          if p.exists():
              data=json.loads(p.read_text(encoding="utf-8"))
              text=f"AI review created {len(data.get('stories',[]))} locally approved candidates; not published"
          else:
              text="AI review did not create an approved issue; previous publication remains intact"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## Manual editorial verification\n\n"+text+"\n")
          PY
      - name: Save private count-only funnel diagnosis, even on AI failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-only-editorial-funnel
          path: data/editorial-funnel.json
          if-no-files-found: warn
          retention-days: 7
      - name: Summarize discovery-to-publication bottlenecks without story data
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          path=Path("data/editorial-funnel.json")
          parts=["","### Private editorial funnel diagnostic",""]
          if path.is_file():
              report=json.loads(path.read_text(encoding="utf-8"))
              parts.append("Stage: "+str(report.get("phase","unknown")))
              parts.append("")
              parts.append("| Stage count | Value |")
              parts.append("| --- | ---: |")
              for key in ("collected","fresh","planned_fetches",
                          "fetchable_original_bodies","candidate_review_groups",
                          "first_ai_batch_groups","drafted","preflight_eligible",
                          "independent_approved","selected_for_edition"):
                  if key in report:
                      parts.append(f"| {key} | {report[key]} |")
              parts.extend(["","Publisher-market region and rejection diagnostic labels do not establish actual event countries."])
          else:
              parts.append("No funnel file; the job failed before collection or independent editorial execution.")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write(chr(10).join(parts)+"\n")
          PY
