name: Suggest AI quips for editor review (manual, free/paid choice)

on:
  workflow_dispatch:
    inputs:
      provider:
        description: AI API provider (manual action; free is selected by default)
        type: choice
        default: openrouter-free
        options:
          - openrouter-free
          - openai-paid

permissions:
  contents: read
  actions: read

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AI_DRAFT_PROVIDER: ${{ inputs.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm operator explicitly configured API access
        shell: bash
        run: |
          if [ "$AI_DRAFT_PROVIDER" = "openrouter-free" ]; then
            if [ -z "$OPENROUTER_API_KEY" ]; then
              echo "::error::OPENROUTER_API_KEY secret is absent. No model API was called."
              exit 1
            fi
          elif [ "$AI_DRAFT_PROVIDER" = "openai-paid" ]; then
            if [ -z "$OPENAI_API_KEY" ]; then
              echo "::error::OPENAI_API_KEY secret is absent. No paid API was called."
              exit 1
            fi
          else
            echo "::error::Unsupported model provider"
            exit 1
          fi
      - name: Find latest successful research harvest
        shell: bash
        run: |
          run_id="$(gh run list --workflow collect-candidates.yml --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful candidate-harvest run found."
            exit 1
          fi
          mkdir -p data
          gh run download "$run_id" --name unverified-news-leads --dir data
          test -f data/editorial-inbox.json
      - name: Generate unverified AI joke proposals (never approve or publish)
        run: python suggest_ai_quips.py
      - uses: actions/upload-artifact@v4
        with:
          name: AI-draft-ideas-UNVERIFIED
          path: data/ai-ideas.json
          retention-days: 3
          if-no-files-found: error
