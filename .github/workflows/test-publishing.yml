name: Test publishing safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'publish_approved.py'
      - 'auto_editorial.py'
      - 'editorial_dates.py'
      - 'editorial_discovery.py'
      - 'editorial_resume.py'
      - 'local_editorial.py'
      - 'release_contract.py'
      - 'prepared_release.py'
      - 'research_article_countries.py'
      - 'article_country_materials.py'
      - 'country_material_prefetch.py'
      - 'country_review_apply.py'
      - 'country_topic_review.py'
      - 'fetch_reviewed_country_topics.sh'
      - 'country-material-reviews/**'
      - 'country_source_drafts.py'
      - 'country_topic_drafts.py'
      - '.github/workflows/research-article-countries.yml'
      - '.github/workflows/prepare-nightly.yml'
      - 'editorial_identity.py'
      - 'editorial_quality.py'
      - 'quip_variety.py'
      - 'country_readiness.py'
      - 'trusted_originals.py'
      - 'collect_candidates.py'
      - 'stage_review.py'
      - '.github/workflows/ai-editorial-preview.yml'
      - '.github/workflows/publish-nightly.yml'
      - '.github/workflows/publication-health.yml'
      - '.github/workflows/deploy-site.yml'
      - 'build_site.py'
      - 'seed_reviewed_photos.py'
      - 'editorial-country-photo-reviews/cache-seeds.json'
      - 'reader_source.py'
      - 'reader_asset_split.py'
      - 'reader_sources/**'
      - 'country_content.py'
      - 'index.html'
      - 'check_country_experience.py'
      - 'check_release_candidate.py'
      - 'run_mobile_preflight.sh'
      - 'check_public_country_release.py'
      - 'check_release_health.py'
      - 'send_release_notice.py'
      - 'audit_country_highlights.py'
      - 'data/news-source-registry.json'
      - 'news_sources.py'
      - 'tests/test_news_sources.py'
      - 'country-highlights.json'
      - 'country-highlight-sources.json'
      - 'travel-stops.json'
      - 'prepare_editorial.py'
      - 'suggest_ai_quips.py'
      - 'notifications.js'
      - 'notification-config.json'
      - 'service-worker.js'
      - 'world-passport.js'
      - 'tests/**'
      - 'data/approved/*.json'
      - '.github/workflows/test-publishing.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prevent canonical country data exceeding GitHub Contents API
        run: python country_manifest_format.py --check
      - name: Verify canonical country content has no divergent exports
        run: python country_content.py --check
      - name: Report pending country editorial preparation without promoting any country
        run: python country_editorial_queue.py --top 8
      - name: Summarize the bulk editorial pipeline and missing licensed photos
        run: python country_batch_progress.py
      - name: Run publishing and privacy tests
        run: python -m unittest discover -s tests -v
      - name: Restore validated, correctly licensed Wikimedia photos
        uses: actions/cache@v4
        with:
          path: .cache/yoru9-photos
          key: yoru9-photo-cache-v1-${{ runner.os }}-${{ hashFiles('travel-stops.json', 'index.html') }}
          restore-keys: |
            yoru9-photo-cache-v1-${{ runner.os }}-
      - name: Restore checksum-pinned reviewed photos before new downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python seed_reviewed_photos.py
      - name: Check public site build
        env:
          YORU9_PHOTO_CACHE_DIR: .cache/yoru9-photos
        run: |
          python build_site.py
          python check_release_candidate.py --site _site
          test -f _site/index.html
          test ! -e _site/data/approved
      - name: Preview mobile navigation, photos and quiz at 320/375/393px before merge
        run: bash run_mobile_preflight.sh
      - name: Preserve pre-release visual diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-mobile-screenshots
          path: mobile-screenshots/
          if-no-files-found: ignore
          retention-days: 7
