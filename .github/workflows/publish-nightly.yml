name: Publish approved news at night (JST)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nightly.yml'
      - 'data/approved/*.json'
  schedule:
    - cron: '7,17,37,47 21 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '7,37 22 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '7,37 23 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication safeguards
        run: python -m unittest discover -s tests -v
      - name: Release only today's verified and editor-approved five stories
        run: python publish_approved.py
      - name: Commit the released edition
        id: release
        shell: bash
        run: |
          git add data/current.json data/archive/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new approved edition; existing site stays unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Release approved nightly issue"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble public reader site (exclude approval data)
        if: steps.release.outputs.changed == 'true'
        run: python build_site.py
      - uses: actions/configure-pages@v5
        if: steps.release.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.changed == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.release.outputs.changed == 'true'
      - name: Dispatch optional release notification (server must be configured)
        if: steps.release.outputs.changed == 'true'
        env:
          PUSH_DISPATCH_URL: ${{ secrets.PUSH_DISPATCH_URL }}
          PUSH_DISPATCH_TOKEN: ${{ secrets.PUSH_DISPATCH_TOKEN }}
        run: python send_release_notice.py
