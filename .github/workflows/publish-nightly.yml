name: Publish approved news at night (JST)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nightly.yml'
      - 'data/approved/*.json'
      - 'auto_editorial.py'
      - 'collect_candidates.py'
  schedule:
    - cron: '7,17,37,47 21 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '7,37 22 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '7,37 23 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
  workflow_run:
    workflows: ['Free-tier AI editorial double-check (safe preview)']
    types: [completed]

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: github-pages
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication safeguards
        run: python -m unittest discover -s tests -v
      - name: Retrieve independently reviewed issue from completed preview
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p /tmp/yoru9-reviewed
          if gh run download "$RUN_ID" --repo "$GH_REPO" --name ai-reviewed-preview --dir /tmp/yoru9-reviewed; then
            DAY=$(TZ=Asia/Tokyo date +%F)
            if [ -f "/tmp/yoru9-reviewed/$DAY.json" ] && [ ! -f "data/approved/$DAY.json" ]; then
              mkdir -p data/approved
              cp "/tmp/yoru9-reviewed/$DAY.json" "data/approved/$DAY.json"
              echo "Retrieved reviewed issue for $DAY"
            fi
          else
            echo 'No reviewed preview artifact; normal safe generation fallback applies.'
          fi
      - name: Check whether today's approved issue already exists
        id: edition
        shell: bash
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          if [ -f "data/approved/$DAY.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect fresh leads when no approved issue exists
        if: steps.edition.outputs.exists == 'false'
        run: python collect_candidates.py
      - name: Generate and independently audit up to three stories
        if: steps.edition.outputs.exists == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "No Gemini API key: keep current edition, never invent news."
          else
            python auto_editorial.py
          fi
      - name: Release today's verified one-to-three-story edition
        env:
          ONE_TIME_IMMEDIATE_RELEASE: ${{ github.event_name == 'workflow_run' || (github.event_name == 'push' && github.event.head_commit.message == 'Publish approved November 16 edition now') }}
        run: |
          if [ "$ONE_TIME_IMMEDIATE_RELEASE" = 'true' ] && [ "$(TZ=Asia/Tokyo date +%F)" = '2026-11-16' ]; then
            python publish_approved.py --publish-now
          else
            python publish_approved.py
          fi
      - name: Commit the released edition
        id: release
        shell: bash
        run: |
          git add data/current.json data/archive/ data/approved/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new approved edition; existing site stays unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Release approved nightly issue"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble public reader site (exclude approval data)
        if: steps.release.outputs.changed == 'true'
        run: python build_site.py
      - uses: actions/configure-pages@v5
        if: steps.release.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.changed == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.release.outputs.changed == 'true'
      - name: Dispatch optional release notification (server must be configured)
        if: steps.release.outputs.changed == 'true'
        env:
          PUSH_DISPATCH_URL: ${{ secrets.PUSH_DISPATCH_URL }}
          PUSH_DISPATCH_TOKEN: ${{ secrets.PUSH_DISPATCH_TOKEN }}
        run: python send_release_notice.py
