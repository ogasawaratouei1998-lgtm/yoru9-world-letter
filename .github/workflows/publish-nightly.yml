name: Publish approved news at night (JST)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nightly.yml'
      - 'data/approved/*.json'
      - 'auto_editorial.py'
      - 'collect_candidates.py'
  schedule:
    - cron: '7,17,37,47 21 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '7,37 22 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '7,37 23 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
  workflow_run:
    workflows: ['Free-tier AI editorial double-check (safe preview)']
    types: [completed]

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: github-pages
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication safeguards
        run: python -m unittest discover -s tests -v
      - name: Recover best reviewed issue from recent successful reviews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Tokyo date +%F)
          mkdir -p /tmp/yoru9-reviewed
          # A previous review may have verified three stories while a newer
          # retry verifies only two. Preserve the best independently audited
          # same-day artifact, never overwrite it with a smaller edition.
          IDS=""
          if [ -n "$TRIGGER_RUN_ID" ]; then IDS="$TRIGGER_RUN_ID"; fi
          RECENT=$(gh run list --repo "$GH_REPO" --workflow "Free-tier AI editorial double-check (safe preview)" --branch main --status success --limit 15 --json databaseId --jq '.[].databaseId' || true)
          IDS=$(printf '%s\n%s\n' "$IDS" "$RECENT" | awk 'NF && !seen[$0]++')
          for RUN_ID in $IDS; do
            mkdir -p "/tmp/yoru9-reviewed/$RUN_ID"
            if gh run download "$RUN_ID" --repo "$GH_REPO" --name ai-reviewed-preview --dir "/tmp/yoru9-reviewed/$RUN_ID" >/dev/null 2>&1; then
              echo "Recovered reviewed artifact from run $RUN_ID"
            fi
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from publish_approved import validate_approved
          from datetime import datetime
          from zoneinfo import ZoneInfo
          day=datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          target=Path("data/approved")/(day+".json")
          candidates=list(Path("/tmp/yoru9-reviewed").glob("*/"+day+".json"))
          if target.exists(): candidates.append(target)
          valid=[]
          for candidate in candidates:
              try:
                  payload=json.loads(candidate.read_text(encoding="utf-8"))
                  validate_approved(payload,day)
                  valid.append((len(payload["stories"]),candidate,payload))
              except (ValueError,KeyError,TypeError,OSError) as exc:
                  print("Rejected invalid preview:",candidate.parent.name,type(exc).__name__)
          if valid:
              count,source,payload=max(valid,key=lambda item:item[0])
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              print(f"Selected same-day independently reviewed issue: {count} stories")
          else:
              print("No valid reviewed issue available; normal generation may run.")
          PY
      - name: Check whether today's approved issue already exists
        id: edition
        shell: bash
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          if [ -f "data/approved/$DAY.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect fresh leads when no approved issue exists
        if: steps.edition.outputs.exists == 'false'
        run: python collect_candidates.py
      - name: Generate and independently audit up to three stories
        if: steps.edition.outputs.exists == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "No Gemini API key: keep current edition, never invent news."
          else
            python auto_editorial.py
          fi
      - name: Release today's verified one-to-three-story edition
        env:
          ONE_TIME_IMMEDIATE_RELEASE: ${{ github.event_name == 'workflow_run' || (github.event_name == 'push' && github.event.head_commit.message == 'Publish approved November 16 edition now') }}
        run: |
          if [ "$ONE_TIME_IMMEDIATE_RELEASE" = 'true' ] && [ "$(TZ=Asia/Tokyo date +%F)" = '2026-11-16' ]; then
            python publish_approved.py --publish-now
          else
            python publish_approved.py
          fi
      - name: Commit the released edition
        id: release
        shell: bash
        run: |
          git add data/current.json data/archive/ data/approved/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new approved edition; existing site stays unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Release approved nightly issue"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble public reader site (exclude approval data)
        if: steps.release.outputs.changed == 'true'
        run: python build_site.py
      - uses: actions/configure-pages@v5
        if: steps.release.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.changed == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.release.outputs.changed == 'true'
      - name: Dispatch optional release notification (server must be configured)
        if: steps.release.outputs.changed == 'true'
        env:
          PUSH_DISPATCH_URL: ${{ secrets.PUSH_DISPATCH_URL }}
          PUSH_DISPATCH_TOKEN: ${{ secrets.PUSH_DISPATCH_TOKEN }}
        run: python send_release_notice.py
