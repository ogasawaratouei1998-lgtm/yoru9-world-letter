name: Publish approved news at night (JST)

on:
  push:
    branches: [main]
    paths:
      - 'data/approved/*.json'
      # Changes to the notifier also retry any already-published issue.
      # The backend atomically deduplicates by editionDate.
      - 'send_release_notice.py'
      - '.github/workflows/publish-nightly.yml'
  schedule:
    - cron: '7,17,37,47 21 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '7,37 22 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '7,37 23 * * *'
      timezone: 'Asia/Tokyo'
    # UTC fallback slots supplement the local-time schedule. Each release is
    # idempotent and immutable; if the JST schedule runs, these are no-ops.
    - cron: '13,43 12 * * *' # 21:13 / 21:43 JST
    - cron: '13 13 * * *'    # 22:13 JST
    - cron: '53 12 * * *'   # backup 21:53 JST
    - cron: '23 13 * * *'   # backup 22:23 JST
    # If GitHub delays the first scheduled release, retry with no duplicate
    # content or push: archive immutability and backend day-level dedupe apply.
  workflow_dispatch:
  workflow_run:
    workflows: ['Free-tier AI editorial double-check (safe preview)']
    types: [completed]

permissions:
  actions: read
  contents: write
  statuses: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: github-pages
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'push')
    steps:
      - name: Record nightly run start and link for diagnosis
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=yoru9/nightly-diagnostic \
            -f description="$(TZ=Asia/Tokyo date +%F): nightly run started" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check publication safeguards
        id: safeguards
        run: python -m unittest discover -s tests -v
      - name: Complete the approved November 20 four-story SVG correction
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from publish_approved import publish

          root=Path.cwd()
          approved=root/"data/approved/2026-11-20.json"
          current=root/"data/current.json"
          if approved.is_file() and current.is_file():
              draft=json.loads(approved.read_text(encoding="utf-8"))
              live=json.loads(current.read_text(encoding="utf-8"))
              if (live.get("editionDate")=="2026-11-20"
                      and len(live.get("stories",[]))==2
                      and draft.get("fourStoryStaticIllustrationReissue") is True
                      and draft.get("approvedBy")=="editorial-source-checked-correction-2026-11-20"
                      and len(draft.get("stories",[]))==4):
                  # Explicitly approved correction to the dated Nov 20 issue;
                  # do not mislabel it as Nov 21, create any AI image, or
                  # replace a newer (Nov 21+) public edition.
                  publish(root,datetime.fromisoformat("2026-11-20T23:59:00+09:00"))
                  print("Completed the verified Nov 20 SVG correction.")
              else:
                  print("Nov 20 correction not eligible/already completed; preserve live edition.")
          PY
      - name: Immediately publish explicitly requested approved November 16 edition
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from publish_approved import publish, validate_approved

          root = Path.cwd()
          approved = root / "data/approved/2026-11-16.json"
          current = root / "data/current.json"
          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          if not approved.is_file():
              print("Previously approved November 16 issue is absent.")
          else:
              data = json.loads(approved.read_text(encoding="utf-8"))
              validate_approved(data, "2026-11-16")
              previous = json.loads(current.read_text(encoding="utf-8")) if current.exists() else {}
              if (previous.get("editionDate") or "") < "2026-11-16":
                  publish(root, datetime.fromisoformat("2026-11-16T21:07:00+09:00"))
                  print("Released previously approved November 16 issue; retained its original date.")
              else:
                  print("A November 16 or newer edition is already published; no rollback.")
          PY
      - name: Recover best reviewed issue from recent successful reviews
        id: recover_review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Tokyo date +%F)
          # A released edition is immutable. Do not resurrect an older review
          # artifact and overwrite its approved source on later push/retry runs.
          if [ -f "data/archive/$DAY.json" ]; then
            echo "Today's edition is already published; skip reviewed-artifact recovery."
            exit 0
          fi
          # An editor-approved file in main has priority over every cached AI
          # preview regardless of story count. A bigger edition is not always
          # a better one. Fail closed if that file is malformed.
          if [ -f "data/approved/$DAY.json" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from publish_approved import validate_approved
          day=datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          data=json.loads((Path("data/approved")/(day+".json")).read_text(encoding="utf-8"))
          validate_approved(data,day)
          print("Preserving previously approved editorial issue:",day,len(data["stories"]),"stories")
          PY
            exit 0
          fi
          mkdir -p /tmp/yoru9-reviewed
          # If no approved file exists, review artifacts are merely candidates.
          # Choose the most recent valid reviewed artifact, not the largest.
          IDS=""
          if [ -n "$TRIGGER_RUN_ID" ]; then IDS="$TRIGGER_RUN_ID"; fi
          RECENT=$(gh run list --repo "$GH_REPO" --workflow "Free-tier AI editorial double-check (safe preview)" --branch main --status success --limit 50 --json databaseId --jq '.[].databaseId' || true)
          IDS=$(printf '%s\n%s\n' "$IDS" "$RECENT" | awk 'NF && !seen[$0]++')
          for RUN_ID in $IDS; do
            mkdir -p "/tmp/yoru9-reviewed/$RUN_ID"
            if gh run download "$RUN_ID" --repo "$GH_REPO" --name ai-reviewed-preview --dir "/tmp/yoru9-reviewed/$RUN_ID" >/dev/null 2>&1; then
              echo "Recovered reviewed artifact from run $RUN_ID"
            fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from publish_approved import validate_approved
          from datetime import datetime
          from zoneinfo import ZoneInfo
          day=datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          target=Path("data/approved")/(day+".json")
          candidates=sorted(Path("/tmp/yoru9-reviewed").glob("*/"+day+".json"),
                            key=lambda p:int(p.parent.name),reverse=True)
          valid=[]
          for candidate in candidates:
              try:
                  payload=json.loads(candidate.read_text(encoding="utf-8"))
                  validate_approved(payload,day)
                  valid.append((len(payload["stories"]),candidate,payload))
              except (ValueError,KeyError,TypeError,OSError) as exc:
                  print("Rejected invalid preview:",candidate.parent.name,type(exc).__name__)
          if valid:
              count,source,payload=valid[0]
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              print(f"Selected latest verified review {source.parent.name}: {count} stories")
          else:
              print(f"No valid reviewed issue for {day}; checked {len(candidates)} candidate files. Normal generation may run.")
          PY
      - name: Check whether today's approved issue already exists
        id: edition
        shell: bash
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          if [ -f "data/approved/$DAY.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # ChatGPT prepares approved JSON directly; the publisher needs no AI API.
      # Gemini collection and editing are legacy fallback, explicitly opt-in only.
      # Audit viable drafts before supplemental generation to protect scarce AI quota.
      # Explicit operator retry commits work on any date; ordinary pushes
      # never run news discovery or the paid/free-tier AI API. Existing per-day
      # publication, source, editorial, photo and public-site gates remain intact.
      - name: Collect fresh leads when no approved issue exists
        id: collect
        if: >-
          vars.YORU9_ENABLE_GEMINI == 'true' &&
          steps.edition.outputs.exists == 'false' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Editorial retry on demand: ')))
        run: python collect_candidates.py
      - name: Review source-grounded stories without a publication count quota
        id: editorial
        if: >-
          vars.YORU9_ENABLE_GEMINI == 'true' &&
          steps.edition.outputs.exists == 'false' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Editorial retry on demand: ')))
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "No Gemini API key: keep current edition, never invent news."
            echo "result=missing_key" >> "$GITHUB_OUTPUT"
          else
            python auto_editorial.py
          fi
      - name: Explain any editorial shortfall without sending notifications
        if: always()
        run: python editorial_health_report.py
      - name: Preserve count-only nightly editorial diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-editorial-funnel-diagnostics
          path: data/editorial-funnel.json
          if-no-files-found: ignore
          retention-days: 7
      # Static editorial SVG artwork is bundled; never call paid image APIs.
      - name: Release every approved story (skip only when none qualify)
        id: publish_issue
        env:
          ONE_TIME_IMMEDIATE_RELEASE: ${{ github.event_name == 'workflow_run' || (github.event_name == 'push' && github.event.head_commit.message == 'Publish approved November 16 edition now') }}
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          if [ -f "data/archive/$DAY.json" ]; then
            # One user-requested, source-reviewed correction is explicitly gated
            # to the original November 20 issue. Ordinary releases stay immutable.
            if [ "$DAY" = "2026-11-20" ] && python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("data/approved/2026-11-20.json").read_text(encoding="utf-8"))
          assert doc.get("approvedBy")=="editorial-source-checked-correction-2026-11-20"
          PY
            then
              python publish_approved.py
            else
              echo "Today's edition is already published; preserve its immutable archive and skip replacement."
            fi
          elif [ "$ONE_TIME_IMMEDIATE_RELEASE" = 'true' ] && [ "$DAY" = '2026-11-16' ]; then
            python publish_approved.py --publish-now
          else
            python publish_approved.py
          fi
      - name: Remove stale generated images after verified SVG-illustrated release
        run: python prepare_news_images.py --rotate
      - name: Restore validated, correctly licensed Wikimedia photos
        uses: actions/cache@v4
        with:
          path: .cache/yoru9-photos
          key: yoru9-photo-cache-v1-${{ runner.os }}-${{ hashFiles('travel-stops.json', 'index.html') }}
          restore-keys: |
            yoru9-photo-cache-v1-${{ runner.os }}-
      - name: Restore checksum-pinned reviewed photos before new downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python seed_reviewed_photos.py
      - name: Preflight full reader and photo bundle before any release commit
        id: preflight
        env:
          YORU9_PHOTO_CACHE_DIR: .cache/yoru9-photos
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/current.json data/archive/index.json; then
            TODAY=$(TZ=Asia/Tokyo date +%F)
            RELEASE_DAY=$(python -c "import json;print(json.load(open('data/current.json'))['editionDate'])")
            if [ "$TODAY" != "$RELEASE_DAY" ]; then
              echo "No current-day edition; preserve current site."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The release may have been committed before a failed Pages deployment.
            # A retry must rebuild/redeploy that same immutable edition, not just retry push.
            if python - <<'PY'
          import json, os, time
          from pathlib import Path
          from check_public_country_release import fetch_assets
          names=("data/current.json","data/archive/index.json")
          try:
              public=fetch_assets("https://ogasawaratouei1998-lgtm.github.io/yoru9-world-letter/",
                                  os.environ["GITHUB_RUN_ID"]+"-"+str(time.time_ns()),names)
              assert all(json.loads(public[name])==json.loads(Path(name).read_bytes()) for name in names)
          except (OSError, ValueError, AssertionError) as exc:
              print("Live release needs recovery:",type(exc).__name__)
              raise SystemExit(1)
          PY
            then
              echo "Live edition already matches; skip redundant deployment."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Recover committed but not deployed current-day edition."
          fi
          # Every future issue must pass the complete editorial/visual
          # contract BEFORE it is committed or deployed.
          # Visual QA follows the approved story count and verified quiz photo keys.
          python check_release_candidate.py
          python build_site.py
          python check_release_candidate.py --site _site
          # Catch UI/navigation/quiz/photo failures before publication,
          # not only in the later post-deploy smoke.
          bash run_mobile_preflight.sh
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Preserve failed candidate screenshots for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-nightly-reader-screenshots
          path: mobile-screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit the released edition
        id: release
        shell: bash
        run: |
          git add data/current.json data/archive/ data/approved/
          if [ -d assets/news-generated ]; then
            git add -A assets/news-generated/
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No new approved edition; existing site stays unchanged."
          else
            # An approved file staged before 21:00 is not a public edition.
            if git diff --cached --name-only | grep -Eq '^(data/current[.]json|data/archive/[^/]+[.]json)$'; then
              echo "published=true" >> "$GITHUB_OUTPUT"
            else
              echo "published=false" >> "$GITHUB_OUTPUT"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Release approved nightly issue"
            # Another workflow or editor may update main during this run.
            # Rebase only if cleanly possible; never force-push or overwrite a conflict.
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Release data conflicts with newer main. Preserving remote data; retry via a new run."
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Main changed during publication (attempt $attempt/5); retrying safely."
              sleep $((attempt * 2))
            done
            if [ "$pushed" != true ]; then
              echo "::error::Unable to push released edition after five safe attempts."
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify preflighted public reader bundle is ready
        if: steps.preflight.outputs.deploy == 'true' && success()
        run: |
          test -f _site/index.html
          python check_release_candidate.py --site _site
      - uses: actions/configure-pages@v5
        if: steps.preflight.outputs.deploy == 'true' && success()
      - uses: actions/upload-pages-artifact@v3
        if: steps.preflight.outputs.deploy == 'true' && success()
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployed_reader
        if: steps.preflight.outputs.deploy == 'true' && success()
        continue-on-error: true
      - name: Wait before retrying a failed Pages deployment
        if: success() && steps.preflight.outputs.deploy == 'true' && steps.deployed_reader.outcome == 'failure'
        run: sleep 20
      - uses: actions/deploy-pages@v4
        id: deployed_reader_retry
        if: success() && steps.preflight.outputs.deploy == 'true' && steps.deployed_reader.outcome == 'failure'
      - name: Verify the actual public Pages data before any release notification
        id: live_verify
        # Also verify when retrying a previously released issue. A successful
        # git commit without a successful Pages deployment must NEVER trigger
        # a delayed push through the retry path.
        if: success()
        timeout-minutes: 4
        env:
          PUBLISHED_SITE: ${{ steps.deployed_reader_retry.outputs.page_url || steps.deployed_reader.outputs.page_url }}
          PUBLISHED_REVISION: ${{ github.sha }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          RELEASE_DAY=$(python -c "import json;print(json.load(open('data/current.json'))['editionDate'])")
          if [ "$TODAY" = "$RELEASE_DAY" ]; then
            SITE="${PUBLISHED_SITE:-https://ogasawaratouei1998-lgtm.github.io/yoru9-world-letter/}"
            python check_public_country_release.py --site "$SITE" --revision "$PUBLISHED_REVISION"
          else
            echo "No current-day release eligible for a notification; live verification not required."
          fi
      # Recheck dispatch even if the publication already exists.
      # The notifier gates by TODAY and after 21:00; the backend deduplicates.
      # This recovers a push that failed after a successful Pages deployment.
      - name: Dispatch optional release notification (server must be configured)
        id: dispatch_notice
        if: success()
        timeout-minutes: 3
        env:
          PUSH_DISPATCH_URL: ${{ secrets.PUSH_DISPATCH_URL }}
          PUSH_DISPATCH_TOKEN: ${{ secrets.PUSH_DISPATCH_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python send_release_notice.py

      # The status API exposes only fixed stage codes, counts, date and a run
      # link. Never include headlines, article bodies, raw provider errors or keys.
      - name: Record exact nightly outcome and run link for diagnosis
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
          SAFEGUARDS: ${{ steps.safeguards.outcome }}
          RECOVER_REVIEW: ${{ steps.recover_review.outcome }}
          COLLECT: ${{ steps.collect.outcome }}
          EDITORIAL: ${{ steps.editorial.outcome }}
          EDITORIAL_RESULT: ${{ steps.editorial.outputs.result }}
          PUBLISH_ISSUE: ${{ steps.publish_issue.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          COMMIT_RELEASE: ${{ steps.release.outcome }}
          DEPLOY_FIRST: ${{ steps.deployed_reader.outcome }}
          DEPLOY_RETRY: ${{ steps.deployed_reader_retry.outcome }}
          LIVE_VERIFY: ${{ steps.live_verify.outcome }}
          NOTICE: ${{ steps.dispatch_notice.outcome }}
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          STATE=success
          if [ "$JOB_RESULT" != success ]; then STATE=failure; fi
          REASON=$(python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          day=datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          def read(path):
              try:
                  value=json.loads(Path(path).read_text(encoding="utf-8"))
                  return value if isinstance(value,dict) else {}
              except (OSError,ValueError):
                  return {}
          funnel=read("data/editorial-funnel.json")
          phase=funnel.get("phase","")
          allowed={"fresh_filter","publisher_leads_unavailable","fetch_plan","body_fetch",
                   "publisher_articles_unavailable","shortlist","budget_blocked",
                   "model_quota_blocked","model_unavailable","draft","draft_empty","audit","country_readiness",
                   "no_publishable_stories","selected"}
          if phase not in allowed: phase="no_funnel"
          for key in ("SAFEGUARDS","RECOVER_REVIEW","COLLECT","EDITORIAL","PUBLISH_ISSUE",
                      "PREFLIGHT","COMMIT_RELEASE","DEPLOY_RETRY","LIVE_VERIFY","NOTICE"):
              if os.environ.get(key)=="failure":
                  print(key.lower()+"_failed; "+phase)
                  break
          else:
              issue=read("data/current.json")
              approved=read("data/approved/"+day+".json")
              if os.environ.get("EDITORIAL_RESULT")=="missing_key":
                  print("missing_ai_key")
              elif (issue.get("editionDate")==day and issue.get("status")=="published"
                    and os.environ.get("LIVE_VERIFY")=="success"):
                  print("live_verified; "+str(len(issue.get("stories",[])))+" stories")
              elif approved.get("editionDate")==day:
                  print("approved_not_live; "+phase)
              elif os.environ.get("JOB_RESULT")!="success":
                  print("job_incomplete; "+phase)
              else:
                  print("no_approved_issue; "+phase)
          PY
          )
          case "$REASON" in
            missing_ai_key|no_approved_issue\;\ model_quota_blocked|no_approved_issue\;\ model_unavailable|no_approved_issue\;\ budget_blocked) STATE=error ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" -f context=yoru9/nightly-diagnostic \
            -f description="$DAY: $REASON" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
