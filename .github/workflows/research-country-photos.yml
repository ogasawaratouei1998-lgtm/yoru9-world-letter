name: Research licensed country photographs

on:
  workflow_dispatch:
  # Manual bulk research only; routine work starts from approved articles.

permissions:
  contents: read

concurrency:
  group: country-commons-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the canonical dataset without publishing pending countries
        run: python country_content.py --check
      - name: Research Commons JPEGs and license metadata without selecting images
        run: python country_photo_candidates.py --output reports/country-photo-candidates.json --limit 3
      - name: Inventory current pending countries from UNESCO official XML feed
        continue-on-error: true
        run: python country_unesco_source_catalog.py --output reports/country-official-source-inventory.json
      - name: Preserve source links, photographer credits, CC licenses and required visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-photo-metadata-candidates
          path: |
            reports/country-photo-candidates.json
            reports/country-official-source-inventory.json
          if-no-files-found: warn
          retention-days: 14
