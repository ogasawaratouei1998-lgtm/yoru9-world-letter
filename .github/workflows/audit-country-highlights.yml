name: Audit country portraits and time-sensitive topics

on:
  schedule:
    # Daily at 11:17 JST (GitHub scheduling may be delayed).
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'country-highlights.json'
      - 'audit_country_highlights.py'
      - 'tests/test_country_highlights_monitor.py'
      - 'data/current.json'
      - '.github/workflows/audit-country-highlights.yml'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test independent country-topic monitoring
        run: python -m unittest discover -s tests -p test_country_highlights_monitor.py -v
      - name: Audit only published, recent issue countries
        run: python audit_country_highlights.py --horizon 7 --urgent-days 2 --json-out country-highlights-audit.json
      - name: Keep a dated audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: country-highlights-audit
          path: country-highlights-audit.json
          retention-days: 14
      - name: Open one editorial issue only when a verified topic is urgently missing
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('country-highlights-audit.json', 'utf8'));
            const registry = JSON.parse(fs.readFileSync('country-highlights.json', 'utf8'));
            const { owner, repo } = context.repo;
            const title = '国紹介｜時事トピックの補充が必要';
            const marker = '<!-- yoru9-country-highlights-audit -->';
            const open = await github.paginate(github.rest.issues.listForRepo,
              {owner, repo, state: 'open', per_page: 100});
            const existing = open.find(item => !item.pull_request &&
              item.title === title && item.body?.includes(marker));

            if (!report.needsEditorialReview) {
              if (existing) {
                await github.rest.issues.update({owner, repo, issue_number: existing.number,
                  state: 'closed'});
              }
              core.info('No urgent verified cultural topic gaps: no notification needed.');
              return;
            }

            const lines = [marker,
              '配信済みの国紹介で、**本日または翌日の確認済み時事トピックが不足**しています。',
              '国紹介は文化・暮らし中心、小旅行は有名観光地のみ。両者の文章・写真は流用しません。',
              '', '### 補充対象'];
            for (const item of report.urgent) {
              const source = (registry.highlights[item.country] || []).at(-1)?.sourceUrl;
              lines.push('- **' + item.country + '**：確認済みの新しい文化・社会トピックが必要' +
                (source ? '（[以前の公式資料](' + source + ')）' : '（公式情報源の選定から必要）'));
            }
            lines.push('', '公式情報の開催日と本文を照合し、確認日・掲載開始日・掲載期限・出典を登録してください。',
              '未検証のRSS見出しやニュースの失敗談を国紹介に転用しないでください。',
              '古い話題はアプリ側で自動的に隠します。監査ログはActionsの成果物にあります。');
            const body = lines.join('\n');
            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
              }
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }
