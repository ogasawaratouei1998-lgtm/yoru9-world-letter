name: Prepare country materials after article approval
on:
  workflow_run:
    workflows: ['Free-tier AI editorial double-check (safe preview)']
    types: [completed]
  workflow_dispatch:
  # Cover curated editions and late article additions, not just AI artifacts.
  push:
    branches: [main]
    paths:
      - 'data/approved/*.json'
  schedule:
    - cron: '30 10 * * *' # 19:30 JST recovery, before the 21:00 release
permissions:
  contents: read
  actions: read
concurrency:
  group: yoru9-article-country-research
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate validated same-day article
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          mkdir -p "$RUNNER_TEMP/approved"
          if [ -f "data/approved/$DAY.json" ]; then
            cp "data/approved/$DAY.json" "$RUNNER_TEMP/approved/$DAY.json"
          elif [ ! -f "data/archive/$DAY.json" ]; then
            CUTOFF="$(date -u -d "$DAY - 1 day" +%F)T15:00:00Z"
            IDS=$(gh run list --workflow "Free-tier AI editorial double-check (safe preview)" --branch main --status success --limit 30 --json databaseId,createdAt | jq -r --arg cutoff "$CUTOFF" '.[] | select(.createdAt >= $cutoff) | .databaseId') || IDS=""
            mkdir -p "$RUNNER_TEMP/reviews"
            for ID in $(printf '%s\n%s\n' "$RUN_ID" "$IDS" | awk 'NF && !seen[$0]++'); do
              mkdir -p "$RUNNER_TEMP/reviews/$ID"
              gh run download "$ID" --name ai-reviewed-preview --dir "$RUNNER_TEMP/reviews/$ID" || true
            done
            python - <<'PY'
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from release_contract import recover_review
          day=datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          # A local-only checkout: the workflow has no repository write permission.
          state,count=recover_review(Path.cwd(),day,Path(os.environ["RUNNER_TEMP"])/"reviews")
          PY
            if [ -f "data/approved/$DAY.json" ]; then
              cp "data/approved/$DAY.json" "$RUNNER_TEMP/approved/$DAY.json"
            fi
          fi
          echo "path=$RUNNER_TEMP/approved/$DAY.json" >> "$GITHUB_OUTPUT"
      - name: Retrieve speculative draft leads from the triggering editorial run
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/country-prefetch"
          gh run download "$RUN_ID" --name country-prefetch --dir "$RUNNER_TEMP/country-prefetch" || true
      - name: Prepare drafts, official source leads and photo review files for all article countries
        env:
          APPROVED_PATH: ${{ steps.issue.outputs.path }}
        run: python research_article_countries.py --approved "$APPROVED_PATH" --output reports/article-countries --prefetched "$RUNNER_TEMP/country-prefetch/yoru9-country-prefetch.json"
      - uses: actions/upload-artifact@v4
        with:
          name: article-country-research
          path: reports/article-countries/
          if-no-files-found: ignore
          retention-days: 7
