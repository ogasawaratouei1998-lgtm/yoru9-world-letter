name: Test isolated push backend

on:
  push:
    branches: [main]
    paths:
      - 'push-backend/**'
      - '.github/workflows/test-push-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.5.6'
      - name: Type-check Supabase Edge Function and pinned Web Push library
        working-directory: push-backend
        run: deno check index.ts
      - name: Test endpoint, SSRF, date, token and subscription safeguards
        working-directory: push-backend
        run: deno test validation_test.ts
