name: Free-tier AI editorial double-check (safe preview)
on:
  workflow_dispatch:
  schedule:
    # Start editorial work well before the delivery deadline (18:15 JST).
    - cron: '15 9 * * *'
    # Second opportunity if the early review did not produce an approved issue.
    - cron: '45 19 * * *'
      timezone: 'Asia/Tokyo'
permissions:
  contents: read
jobs:
  review:
    # ChatGPT is primary; Gemini requires explicit operator opt-in.
    if: vars.YORU9_ENABLE_GEMINI == 'true'
    runs-on: ubuntu-latest
    # The collection step and safety tests precede the bounded 9-minute AI review.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run safety tests without API access
        run: python -m unittest discover -s tests -p 'test_auto_editorial.py' -v
      - name: Check whether today's approved issue already exists
        id: edition
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          if [ -f "data/approved/$DAY.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify AI key is present (without exposing it)
        if: steps.edition.outputs.exists == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'Gemini API key is not configured'; exit 1
          fi
          echo 'Gemini API key is configured'
      - name: Collect same-day leads
        if: steps.edition.outputs.exists == 'false'
        run: python collect_candidates.py
      # This workflow runs a real AI review only on schedule/manual dispatch.
      # Code pushes are tested by the separate publishing safety workflow.
      # This job never publishes directly. A separate release workflow retrieves its verified artifact,
      # revalidates it, and publishes only when the release timing rule permits.
      # Provider error details are sanitized in auto_editorial.py.
      - name: Independent AI double-check (no publication)
        if: steps.edition.outputs.exists == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python auto_editorial.py
      - name: Summarize editorial funnel without exposing source material
        if: always()
        run: python editorial_health_report.py
      - name: Stage only today's publication-valid reviewed issue
        id: staged
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          python stage_review.py --day "$DAY" --destination "$RUNNER_TEMP/yoru9-reviewed"
      - name: Save one validated review privately for the nightly publisher
        if: steps.staged.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviewed-preview
          path: ${{ steps.staged.outputs.path }}
          if-no-files-found: error
          retention-days: 3
      # Private audit artifact: counts and publisher-market regions ONLY.
      # No article bodies, headlines, URLs, draft text, or candidate identities.
      - name: Store editorial funnel diagnostics (never publish)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-funnel-diagnostics
          path: data/editorial-funnel.json
          if-no-files-found: warn
          retention-days: 7
