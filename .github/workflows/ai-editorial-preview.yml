name: Free-tier AI editorial double-check (safe preview)
# 2026-11-27: explicit CPU-only release acceptance after compact final validation (PR 261).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-editorial-preview.yml'
  schedule:
    # Prepare today's edition from the morning (UTC cron, Japan has no DST).
    # Later slots are recovery opportunities; a staged/committed issue is reused.
    - cron: '15 21 * * *' # 06:15 JST next calendar day
    - cron: '15 0 * * *'  # 09:15 JST
    - cron: '15 3 * * *'  # 12:15 JST
    - cron: '15 6 * * *'  # 15:15 JST
    - cron: '15 9 * * *'  # 18:15 JST
    - cron: '45 10 * * *' # 19:45 JST
    - cron: '15 12 * * *' # 21:15 JST, same-day recovery
permissions:
  contents: read
  actions: read
  statuses: write
concurrency:
  group: yoru9-editorial-preview
  cancel-in-progress: false
jobs:
  review:
    # Ordinary code pushes never launch inference. One explicitly named trial can.
    if: >-
      github.event_name != 'push' || startsWith(github.event.head_commit.message, 'Local editorial trial: ')
    runs-on: ubuntu-latest
    # Model download, CPU inference and source retrieval all need bounded time.
    timeout-minutes: 55
    steps:
      - name: Record editorial run start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=yoru9/internal-editorial \
            -f description="Editorial preview running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run safety tests without API access
        run: |
          python -m unittest discover -s tests -p 'test_auto_editorial.py' -v
          python -m unittest discover -s tests -p 'test_local_editorial.py' -v
          python -m unittest discover -s tests -p 'test_workflow_editorial_priority.py' -v
          python -m unittest discover -s tests -p 'test_editorial_resume.py' -v
          python -m unittest discover -s tests -p 'test_editorial_untried_refill.py' -v
          python -m unittest discover -s tests -p 'test_same_day_preview_refill.py' -v
      - name: Check whether today's approved issue already exists
        id: edition
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          if [ -f "data/archive/$DAY.json" ]; then
            echo "archived=true" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Today's edition is archived; do not spend another AI run."
          else
            echo "archived=false" >> "$GITHUB_OUTPUT"
            if [ -f "data/approved/$DAY.json" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Recover validated same-day preview and decide whether to extend it
        if: steps.edition.outputs.exists == 'false'
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Tokyo date +%F)
          CUTOFF="$(date -u -d "$DAY - 1 day" +%F)T15:00:00Z"
          mkdir -p "$RUNNER_TEMP/prior-reviews"
          IDS=$(gh run list --workflow "Free-tier AI editorial double-check (safe preview)" --branch main --status success --limit 30 --json databaseId,createdAt | jq -r --arg cutoff "$CUTOFF" '.[] | select(.createdAt >= $cutoff) | .databaseId') || {
            echo "::warning::Prior review lookup unavailable; continue with normal editorial validation."
            IDS=""
          }
          for RUN_ID in $IDS; do
            mkdir -p "$RUNNER_TEMP/prior-reviews/$RUN_ID"
            gh run download "$RUN_ID" --name ai-reviewed-preview --dir "$RUNNER_TEMP/prior-reviews/$RUN_ID" >/dev/null 2>&1 || true
          done
          python - <<'PY'
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from release_contract import recover_review, should_refill_recovered
          now=datetime.now(ZoneInfo("Asia/Tokyo"))
          day=now.date().isoformat()
          state,count=recover_review(Path.cwd(),day,Path(os.environ["RUNNER_TEMP"])/"prior-reviews")
          refill=should_refill_recovered(Path.cwd(),day,state,count,now)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("ready="+("true" if count and not refill else "false")+"\n")
              f.write("refill="+("true" if refill else "false")+"\n")
          print("Recovered preview stories:",count,"continue unused candidates:",refill)
          PY
      - name: Verify optional Gemini key is present (without exposing it)
        if: steps.edition.outputs.exists == 'false' && steps.prior.outputs.ready != 'true' && vars.YORU9_ENABLE_GEMINI == 'true' && github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'Gemini API key is not configured'; exit 1
          fi
          echo 'Gemini API key is configured'
      - name: Collect same-day leads
        if: steps.edition.outputs.exists == 'false' && steps.prior.outputs.ready != 'true'
        run: python collect_candidates.py
      - name: Restore same-day unfinished publisher queue
        if: steps.edition.outputs.exists == 'false' && steps.prior.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          CUTOFF="$(date -u -d "$DAY - 1 day" +%F)T15:00:00Z"
          IDS=$(gh run list --workflow "Free-tier AI editorial double-check (safe preview)" --branch main --status completed --limit 30 --json databaseId,createdAt | jq -r --arg cutoff "$CUTOFF" '.[] | select(.createdAt >= $cutoff) | .databaseId') || IDS=""
          mkdir -p "$RUNNER_TEMP/yoru9-resume"
          for RUN_ID in $IDS; do
            if gh run download "$RUN_ID" --name editorial-continuation --dir "$RUNNER_TEMP/yoru9-resume" >/dev/null 2>&1; then
              break
            fi
          done
      # Scheduled/manual editorial review uses CPU inference by default.
      # The explicit trial push never invokes Gemini or publishes directly.
      # This job never publishes directly. A separate release workflow retrieves its verified artifact,
      # revalidates it, and publishes only when the release timing rule permits.
      # Provider error details are sanitized in auto_editorial.py.
      - name: Internal CPU editorial double-check (no publication)
        if: steps.edition.outputs.exists == 'false' && steps.prior.outputs.ready != 'true' && (vars.YORU9_ENABLE_GEMINI != 'true' || github.event_name == 'push')
        timeout-minutes: 47
        env:
          YORU9_RESUME_PATH: ${{ runner.temp }}/yoru9-resume/queue.json
          YORU9_REFILL_APPROVED: ${{ steps.prior.outputs.refill }}
          YORU9_COUNTRY_PREFETCH_PATH: ${{ runner.temp }}/yoru9-country-prefetch.json
        run: bash run_local_editorial.sh
      - name: Explicit archived-day model capability trial (no publication)
        if: steps.edition.outputs.archived == 'true' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Local editorial trial:')
        timeout-minutes: 18
        run: bash run_local_editorial.sh --probe-only
      - name: Optional Gemini double-check (no publication)
        if: steps.edition.outputs.exists == 'false' && steps.prior.outputs.ready != 'true' && vars.YORU9_ENABLE_GEMINI == 'true' && github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          YORU9_RESUME_PATH: ${{ runner.temp }}/yoru9-resume/queue.json
          YORU9_REFILL_APPROVED: ${{ steps.prior.outputs.refill }}
          YORU9_COUNTRY_PREFETCH_PATH: ${{ runner.temp }}/yoru9-country-prefetch.json
        run: python auto_editorial.py
      - name: Retain bounded speculative country research (not approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: country-prefetch
          path: ${{ runner.temp }}/yoru9-country-prefetch.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Summarize editorial funnel without exposing source material
        if: always()
        run: python editorial_health_report.py
      - name: Stage only today's publication-valid reviewed issue
        id: staged
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          python stage_review.py --day "$DAY" --destination "$RUNNER_TEMP/yoru9-reviewed"
      - name: Save one validated review privately for the nightly publisher
        if: steps.staged.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-reviewed-preview
          path: ${{ steps.staged.outputs.path }}
          if-no-files-found: error
          retention-days: 3
      # Public-repository Actions artifact: pending public publisher URLs and
      # attempted URL digests only. No article bodies, titles or rejected drafts.
      - name: Preserve same-day unfinished publisher queue (never deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-continuation
          path: ${{ runner.temp }}/yoru9-resume/queue.json
          if-no-files-found: ignore
          retention-days: 1
      # Diagnostic artifact: counts and publisher-market regions ONLY.
      # No article bodies, headlines, URLs, draft text, or candidate identities.
      - name: Store editorial funnel diagnostics (never publish)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-funnel-diagnostics
          path: data/editorial-funnel.json
          if-no-files-found: warn
          retention-days: 7

      - name: Record actual editorial preview outcome
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
          READY: ${{ steps.staged.outputs.ready }}
          ARCHIVED: ${{ steps.edition.outputs.archived }}
          ORIGIN: ${{ steps.staged.outputs.origin }}
        run: |
          STATE=error
          REASON="No validated issue; check editorial logs"
          if [ "$JOB_RESULT" != success ]; then
            STATE=failure
            REASON="Editorial execution failed"
          elif [ "$ARCHIVED" = true ]; then
            STATE=success
            REASON="Edition already archived; no new preview needed"
          elif [ "$READY" = true ] && [ "$ORIGIN" = automated ]; then
            STATE=success
            REASON="Validated automatic issue artifact uploaded"
          elif [ "$READY" = true ]; then
            REASON="Validated manual issue; automation not demonstrated"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" -f context=yoru9/internal-editorial \
            -f description="$REASON" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
