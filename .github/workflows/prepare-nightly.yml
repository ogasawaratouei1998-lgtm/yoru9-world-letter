name: Prepare verified nightly reader before release
on:
  workflow_run:
    workflows: ['Free-tier AI editorial double-check (safe preview)']
    types: [completed]
  workflow_dispatch:
  # A narrowly scoped maintenance push can recover today's preparation
  # without launching another editorial model or granting publish access.
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-nightly.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: yoru9-prepare-nightly
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event != 'push' ||
        startsWith(github.event.workflow_run.head_commit.message, 'Local editorial trial: ')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage verified issue in disposable checkout (never deploy)
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Tokyo date +%F)
          if [ -f "data/archive/$DAY.json" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/reviews"
          if [ ! -f "data/approved/$DAY.json" ]; then
            # Recover the triggering review, or the latest valid same-day
            # artifact when a manual/maintenance run has no triggering ID.
            CUTOFF="$(date -u -d "$DAY - 1 day" +%F)T15:00:00Z"
            IDS=$(gh run list --workflow "Free-tier AI editorial double-check (safe preview)" --branch main --status success --limit 30 --json databaseId,createdAt | jq -r --arg cutoff "$CUTOFF" '.[] | select(.createdAt >= $cutoff) | .databaseId') || IDS=""
            for ID in $(printf '%s\n' "$RUN_ID" $IDS | awk 'NF && !seen[$0]++'); do
              mkdir -p "$RUNNER_TEMP/reviews/$ID"
              gh run download "$ID" --name ai-reviewed-preview --dir "$RUNNER_TEMP/reviews/$ID" || true
            done
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from release_contract import recover_review
          day=datetime.now(ZoneInfo("Asia/Tokyo")).date().isoformat()
          state,count=recover_review(Path.cwd(),day,Path(os.environ["RUNNER_TEMP"])/"reviews")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("ready="+("true" if count else "false")+"\n")
          PY
          if [ -f "data/approved/$DAY.json" ]; then
            echo "Validated today's approved issue; preparing reader bundle."
            # Local simulation only; no contents write, Pages or notification permission.
            python publish_approved.py --now "${DAY}T21:00:00+09:00"
            python prepare_news_images.py --rotate
          fi
      - name: Restore licensed photo cache
        if: steps.stage.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/yoru9-photos
          key: yoru9-photo-cache-v1-${{ runner.os }}-${{ hashFiles('travel-stops.json', 'index.html') }}
          restore-keys: |
            yoru9-photo-cache-v1-${{ runner.os }}-
      - name: Restore reviewed photos
        if: steps.stage.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python seed_reviewed_photos.py
      - name: Build and test the exact candidate before 21:00
        if: steps.stage.outputs.ready == 'true'
        env:
          YORU9_PHOTO_CACHE_DIR: .cache/yoru9-photos
        run: |
          python check_release_candidate.py
          python build_site.py
          python check_release_candidate.py --site _site
          bash run_mobile_preflight.sh
          mkdir -p prepared
          python prepared_release.py seal --site _site --manifest prepared/manifest.json
          mv _site prepared/site
      - name: Preserve the sealed candidate for real-time release gate
        if: steps.stage.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prepared-nightly-reader
          path: prepared/
          if-no-files-found: error
          retention-days: 2
