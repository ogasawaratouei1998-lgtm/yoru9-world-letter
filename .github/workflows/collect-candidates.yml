name: Collect unverified news leads

on:
  workflow_dispatch:
  schedule:
    - cron: '37 16 * * *'
      timezone: 'Asia/Tokyo'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect candidate headlines (not verified)
        run: python collect_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: unverified-news-leads
          path: data/candidates.json
          if-no-files-found: error
          retention-days: 7
