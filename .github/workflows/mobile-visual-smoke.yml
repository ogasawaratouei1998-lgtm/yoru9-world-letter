name: Mobile reader visual smoke

on:
  workflow_run:
    workflows: ['Deploy reader website']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Playwright, Chrome and Japanese fonts
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          google-chrome --version
          # Fetch the single licensed Japanese font directly from the
          # upstream Noto repository; avoid slow APT mirrors on hosted runners.
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 90 --silent --show-error \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf" \
            --output "$HOME/.local/share/fonts/NotoSansCJKjp-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
          fc-list :lang=ja | grep -q 'Noto Sans CJK JP'
      - name: Check mobile layout, monthly image, reopen behavior
        run: node tests/mobile_visual_smoke.mjs
      - name: Keep diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-reader-screenshots
          path: mobile-screenshots/
          if-no-files-found: ignore
          retention-days: 7
