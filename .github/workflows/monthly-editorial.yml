name: Independently verify and publish 30-day surprises

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monthly-editorial.yml'
      - 'monthly_research.py'
      - 'auto_editorial.py'
      - 'tests/test_monthly_research.py'
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * *'
      timezone: 'Asia/Tokyo'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  monthly:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original-source quality and publication safeguards
        run: python -m unittest discover -s tests -v
      - name: Review up to two source-grounded monthly surprises
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python monthly_research.py
      - name: Commit only published, audited daily monthly collections
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git add data/monthly/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No independently verified new incidents; keeping the existing monthly shelf."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release independently checked monthly surprises"
          pushed=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Monthly release conflicts with latest main; never force-push."
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 2))
          done
          if [ "$pushed" != true ]; then
            echo "::error::Could not safely commit monthly verified collection."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # A GitHub Actions push using GITHUB_TOKEN does not launch a second
      # push-triggered deploy. Publish the just-committed, audited data here.
      - name: Revalidate and assemble public reader with monthly stories
        if: steps.release.outputs.changed == 'true'
        run: |
          python -m unittest discover -s tests -v
          python build_site.py
      - uses: actions/configure-pages@v5
        if: steps.release.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.changed == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.release.outputs.changed == 'true'
