name: Deploy reader UI changes to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'build_site.py'
      - 'travel-stops.json'
      - 'assets/**'
      - '.github/workflows/reader-ui-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify site and reader UI behavior
        run: python -m unittest discover -s tests -v
      - name: Assemble the complete public site
        run: python build_site.py
      - name: Guard against publishing the old auto-open behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('_site/index.html').read_text(encoding='utf-8')
          worker = Path('_site/service-worker.js').read_text(encoding='utf-8')
          assert "INITIAL_MONTHLY_COLLAPSED" in html
          assert "if(button&&button.getAttribute('aria-expanded')==='false')button.click();" not in html
          assert "const SHELL_CACHE = 'yoru9-shell-v9';" in worker
          print('月間特集・小旅行の初期閉じ状態とキャッシュ更新を確認')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
