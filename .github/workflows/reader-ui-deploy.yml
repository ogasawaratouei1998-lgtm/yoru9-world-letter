name: Deploy reader UI changes to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'tests/test_travel_collapsed.py'
      - 'build_site.py'
      - 'travel-stops.json'
      - 'assets/**'
      - '.github/workflows/reader-ui-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify site and reader UI behavior
        run: python -m unittest discover -s tests -v
      - name: Assemble the complete public site
        run: python build_site.py
      - name: Guard against publishing the old auto-open behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('_site/index.html').read_text(encoding='utf-8')
          worker = Path('_site/service-worker.js').read_text(encoding='utf-8')
          assert "INITIAL_MONTHLY_COLLAPSED" in html
          assert "function closeOptionalTravelPanels()" in html
          assert "closeOptionalTravelPanels();\n if(!navigator.onLine)return;" in html
          assert "panel.hidden=true;\n  panel.replaceChildren();" in html
          assert "if(button&&button.getAttribute('aria-expanded')==='false')button.click();" not in html
          assert "const SHELL_CACHE = 'yoru9-shell-v10';" in worker
          print('月間特集・小旅行の初期閉じ状態とキャッシュ更新を確認')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm the public page serves the updated closed-by-default UI
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          base = os.environ['DEPLOY_URL'].rstrip('/') + '/'
          for attempt in range(18):
              try:
                  stamp = str(time.time_ns())
                  req = Request(urljoin(base, 'index.html') + '?verify=' + stamp,
                                headers={'Cache-Control': 'no-cache', 'User-Agent': 'Yoru9-Release-Check/1.0'})
                  with urlopen(req, timeout=15) as response:
                      html = response.read().decode('utf-8')
                  req_sw = Request(urljoin(base, 'service-worker.js') + '?verify=' + stamp,
                                   headers={'Cache-Control': 'no-cache', 'User-Agent': 'Yoru9-Release-Check/1.0'})
                  with urlopen(req_sw, timeout=15) as response:
                      worker = response.read().decode('utf-8')
                  if ("INITIAL_MONTHLY_COLLAPSED" in html and
                      "function closeOptionalTravelPanels()" in html and
                      "if(button&&button.getAttribute('aria-expanded')==='false')button.click();" not in html and
                      "yoru9-shell-v10" in worker):
                      print('公開サイトから新しい閉じた初期状態と更新版キャッシュを取得できました')
                      break
                  print('公開サイトは更新反映待ち:', attempt + 1)
              except Exception as exc:
                  print('公開サイトの検証を再試行:', repr(exc))
              time.sleep(10)
          else:
              raise SystemExit('公開サイトの更新を確認できませんでした')
          PY
